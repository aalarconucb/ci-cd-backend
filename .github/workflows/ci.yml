name: CI

on:
  pull_request:
    branches: ["main"]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (locked)
        run: npm ci

      - name: Format check (quality gate)
        run: npm run format:check

      - name: Lint (quality gate)
        run: npm run lint

      - name: Unit tests (quality gate)
        run: npm test -- --runInBand

      - name: Build (quality gate)
        run: npm run build
