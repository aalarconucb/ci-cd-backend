name: CD Staging + Production

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  deploy_staging:
    name: Deploy STAGING
    runs-on: self-hosted
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load NVM (Node 20) + PM2
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          nvm use 20
          node -v
          npm -v
          pm2 -v

      - name: Set release id
        run: echo "RELEASE_ID=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV

      - name: Deploy STAGING (releases + symlink)
        shell: bash
        run: |
          set -euo pipefail
          BASE="/var/www/productos-staging"
          REL="$BASE/releases/${RELEASE_ID}"

          echo "Deploying STAGING release: $REL"
          mkdir -p "$REL"

          rsync -av --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            ./ "$REL/"

          ln -sfn "$BASE/shared/.env" "$REL/.env"

          cd "$REL"
          npm ci
          npm run build
          npx prisma migrate deploy

          ln -sfn "$REL" "$BASE/current"
          echo "STAGING current -> $(readlink -f $BASE/current)"

          cd "$BASE/current"
          pm2 start dist/src/main.js --name productos-staging --time --update-env || true
          pm2 restart productos-staging --update-env
          pm2 save

          pm2 status
          pm2 describe productos-staging || true

      - name: Health check STAGING (retry)
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl -fsS http://localhost:3001/api/health > /dev/null; then
              echo "STAGING health OK"
              exit 0
            fi
            echo "Waiting for STAGING... ($i/20)"
            sleep 2
          done
          echo "STAGING health FAILED"
          pm2 status || true
          pm2 logs productos-staging --lines 80 || true
          exit 1

  deploy_production:
    name: Deploy PRODUCTION
    needs: deploy_staging
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load NVM (Node 20) + PM2
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          nvm use 20
          node -v
          npm -v
          pm2 -v

      - name: Set release id
        run: echo "RELEASE_ID=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV

      - name: Deploy PRODUCTION (releases + symlink)
        shell: bash
        run: |
          set -euo pipefail
          BASE="/var/www/productos-prod"
          REL="$BASE/releases/${RELEASE_ID}"

          echo "Deploying PRODUCTION release: $REL"
          mkdir -p "$REL"

          rsync -av --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            ./ "$REL/"

          ln -sfn "$BASE/shared/.env" "$REL/.env"

          cd "$REL"
          npm ci
          npm run build
          npx prisma migrate deploy

          ln -sfn "$REL" "$BASE/current"
          echo "PRODUCTION current -> $(readlink -f $BASE/current)"

          cd "$BASE/current"
          pm2 start dist/src/main.js --name productos-prod --time --update-env || true
          pm2 restart productos-prod --update-env
          pm2 save

          pm2 status
          pm2 describe productos-prod || true

      - name: Health check PRODUCTION (retry)
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl -fsS http://localhost:3002/api/health > /dev/null; then
              echo "PRODUCTION health OK"
              exit 0
            fi
            echo "Waiting for PRODUCTION... ($i/20)"
            sleep 2
          done
          echo "PRODUCTION health FAILED"
          pm2 status || true
          pm2 logs productos-prod --lines 80 || true
          exit 1
